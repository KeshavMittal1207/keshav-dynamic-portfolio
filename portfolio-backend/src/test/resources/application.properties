# H2 Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway during tests
spring.flyway.enabled=false

# JWT Secret
jwt.secret=mockSecretKeyWhichMustBeAtLeast256BitsLongForHMACSHA256AlgorithmToWorkProperly
jwt.expiration=86400000

# Cloudinary (Mock credentials or valid strings to resolve placeholders)
cloudinary.cloud-name=mock-cloud-name
cloudinary.api-key=00000000000000
cloudinary.api-secret=mock-api-secret

# CORS
allowed.origins=http://localhost:5173

# JavaMailSender Configuration (Mock credentials to resolve placeholders)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mock-email@gmail.com
spring.mail.password=mock-gmail-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Multipart Upload Settings
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Default Admin Credentials for tests
admin.default.username=admin
admin.default.password=Admin@123
admin.default.email=admin@example.com
